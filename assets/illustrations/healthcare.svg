<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">就医篇：把看病变成猜谜</title><desc id="d">一张就诊单、一支笔和医疗标志。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="100" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">就医篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">把看病变成猜谜</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">先说清症状，再确认路径</text><rect x="780" y="300" width="250" height="255" rx="12" fill="#c9dfd4" stroke="#253a36" stroke-width="7"/><path d="M815 370h150m-150 40h150m-150 40h95" stroke="#52665e" stroke-width="7"/><circle cx="1000" cy="300" r="56" fill="#dd684b"/><path d="M1000 270v60m-30-30h60" stroke="#f6f1e6" stroke-width="13"/></svg>
