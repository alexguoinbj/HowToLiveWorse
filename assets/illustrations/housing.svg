<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">住房篇：先交钱，再看合同</title><desc id="d">一栋屋顶倾斜的房子和一张合同。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1040" cy="90" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="190" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">住房篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">先交钱，再看合同</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">钥匙到手，问题待解</text><path d="M775 370 L920 250 L1065 370" fill="none" stroke="#253a36" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/><path d="M805 355v165h230V355" fill="#dd684b"/><rect x="885" y="415" width="70" height="105" fill="#f6f1e6"/><rect x="1000" y="435" width="105" height="135" rx="8" fill="#c9dfd4" stroke="#253a36" stroke-width="5"/><path d="M1018 465h68m-68 25h68m-68 25h48" stroke="#253a36" stroke-width="5"/></svg>
