<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">平台篇：先上线，再查规则</title><desc id="d">浏览器窗口和一块待检查的提示牌。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="100" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">平台篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">先上线，再查规则</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">支付、内容和数据，都要有人负责</text><rect x="760" y="300" width="330" height="220" rx="15" fill="#c9dfd4" stroke="#253a36" stroke-width="9"/><path d="M760 350h330" stroke="#253a36" stroke-width="8"/><circle cx="785" cy="325" r="7" fill="#dd684b"/><circle cx="810" cy="325" r="7" fill="#f4d77c"/><rect x="805" y="395" width="190" height="24" rx="12" fill="#dd684b"/><rect x="805" y="440" width="235" height="15" rx="7" fill="#52665e"/></svg>
