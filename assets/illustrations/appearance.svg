<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">外形篇：先追标准，再问身体</title><desc id="d">一面镜子和放在桌上的小花。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="100" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">外形篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">先追标准，再问身体</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">照顾身体，也照顾感受</text><ellipse cx="930" cy="345" rx="112" ry="145" fill="#c9dfd4" stroke="#253a36" stroke-width="12"/><path d="M930 490v45m-70 0h140" stroke="#253a36" stroke-width="12" stroke-linecap="round"/><path d="M760 520h70l-10 45h-50z" fill="#dd684b"/><path d="M795 520v-65" stroke="#253a36" stroke-width="7"/><circle cx="795" cy="445" r="19" fill="#f4d77c"/><circle cx="773" cy="450" r="14" fill="#dd684b"/><circle cx="817" cy="450" r="14" fill="#dd684b"/></svg>
