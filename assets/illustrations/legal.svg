<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">法律篇：先动手，再查规则</title><desc id="d">一张提醒标志和一本规则手册。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="100" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">法律篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">先动手，再查规则</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">不清楚时，先停下来核实</text><path d="M925 285l135 235H790z" fill="#f4d77c" stroke="#253a36" stroke-width="9"/><path d="M925 355v90m0 30v5" stroke="#dd684b" stroke-width="16" stroke-linecap="round"/></svg>
