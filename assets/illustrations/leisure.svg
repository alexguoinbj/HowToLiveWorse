<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">放松篇：把休息也过成挑战赛</title><desc id="d">沙发、饮料和写着待办的纸张。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1020" cy="100" r="230" fill="#f4d77c"/><circle cx="90" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">放松篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">把休息也过成挑战赛</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">出口、价格和心情，请先看清</text><rect x="755" y="365" width="320" height="145" rx="38" fill="#dd684b"/><rect x="785" y="320" width="260" height="110" rx="35" fill="#c9dfd4" stroke="#253a36" stroke-width="7"/><path d="M790 510v35m250-35v35" stroke="#253a36" stroke-width="15"/><rect x="935" y="260" width="105" height="135" rx="5" fill="#f6f1e6" stroke="#253a36" stroke-width="5" transform="rotate(12 987 328)"/><path d="M960 300h50m-50 25h50m-50 25h35" stroke="#253a36" stroke-width="5"/></svg>
