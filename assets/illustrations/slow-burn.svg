<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">慢耗篇：账单寄到之前，先赊着</title><desc id="d">一支正在慢慢烧短的蜡烛。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="100" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">慢耗篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">坏习惯按复利计息</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">账单寄到之前，先赊着</text><ellipse cx="915" cy="298" rx="26" ry="42" fill="#dd684b"/><line x1="915" y1="338" x2="915" y2="360" stroke="#253a36" stroke-width="8"/><rect x="875" y="358" width="80" height="180" rx="12" fill="#f4d77c" stroke="#253a36" stroke-width="10"/><path d="M875 392q14 16 0 34q-14 18 0 36" fill="none" stroke="#253a36" stroke-width="7"/><path d="M955 392q-14 16 0 34q14 18 0 36" fill="none" stroke="#253a36" stroke-width="7"/><rect x="845" y="538" width="140" height="24" rx="10" fill="#253a36"/></svg>