<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">变故之后：不必独自处理所有事</title><desc id="d">窗边的灯和两只茶杯。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="100" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">变故之后</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">不必独自处理所有事</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">先照顾今天，再决定下一步</text><rect x="805" y="275" width="240" height="225" rx="8" fill="#c9dfd4" stroke="#253a36" stroke-width="8"/><path d="M925 275v225m-120-112h240" stroke="#253a36" stroke-width="6"/><path d="M795 525h260" stroke="#253a36" stroke-width="10"/><path d="M845 485h55l-8 40h-40zm95 0h55l-8 40h-40z" fill="#dd684b"/></svg>
