<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">金钱篇：小钱认真，大钱随缘</title><desc id="d">钱包和一张账单。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="100" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">金钱篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">小钱认真，大钱随缘</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">价格、期限和风险一起看</text><rect x="790" y="350" width="280" height="180" rx="25" fill="#dd684b"/><rect x="955" y="410" width="130" height="70" rx="15" fill="#c9dfd4" stroke="#253a36" stroke-width="7"/><circle cx="1000" cy="445" r="10" fill="#253a36"/></svg>
