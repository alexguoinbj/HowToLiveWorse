<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">孕产篇：把产检留给日历提醒</title><desc id="d">一本日历和一朵小花。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="100" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">孕产篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">把产检留给日历提醒</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">有疑问，及时联系医疗团队</text><rect x="790" y="285" width="245" height="245" rx="14" fill="#c9dfd4" stroke="#253a36" stroke-width="8"/><path d="M790 345h245m-190 45h45m35 0h45m-125 50h45m35 0h45" stroke="#52665e" stroke-width="8"/><circle cx="1015" cy="475" r="30" fill="#dd684b"/></svg>
