<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">十八岁之后：路牌先别看</title><desc id="d">指向不同方向的路牌。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="100" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="60" font-weight="bold">十八岁之后</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">路牌先别看</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">路有很多，条件先核实</text><path d="M925 270v275" stroke="#253a36" stroke-width="17"/><path d="M925 300h135l45 35-45 35H925z" fill="#dd684b"/><path d="M925 395H790l-45 35 45 35h135z" fill="#c9dfd4" stroke="#253a36" stroke-width="5"/></svg>
