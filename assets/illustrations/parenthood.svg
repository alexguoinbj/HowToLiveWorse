<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">育儿篇：等孩子出生再算账</title><desc id="d">一辆婴儿车旁放着空白账单和铅笔。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="110" r="230" fill="#f4d77c"/><circle cx="80" cy="655" r="190" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">育儿篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">等孩子出生再算账</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">决定之前，先聊聊彼此的期待</text><path d="M790 350h235l-35 130H850z" fill="#dd684b" stroke="#253a36" stroke-width="7"/><path d="M770 300h45l35 180" fill="none" stroke="#253a36" stroke-width="12" stroke-linecap="round"/><circle cx="865" cy="510" r="28" fill="#253a36"/><circle cx="980" cy="510" r="28" fill="#253a36"/><rect x="965" y="255" width="110" height="130" rx="5" fill="#c9dfd4" stroke="#253a36" stroke-width="5" transform="rotate(12 1020 320)"/></svg>
