<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">关系篇：期待对方自带读心术</title><desc id="d">两个对话气泡和两把椅子。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="100" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">关系篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">期待对方自带读心术</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">说清楚，也听清楚</text><rect x="765" y="300" width="200" height="130" rx="35" fill="#c9dfd4" stroke="#253a36" stroke-width="6"/><path d="M830 430l-25 35 60-35" fill="#c9dfd4" stroke="#253a36" stroke-width="6"/><rect x="930" y="390" width="170" height="110" rx="30" fill="#dd684b"/><circle cx="815" cy="365" r="9" fill="#253a36"/><circle cx="865" cy="365" r="9" fill="#253a36"/><circle cx="915" cy="365" r="9" fill="#253a36"/></svg>
