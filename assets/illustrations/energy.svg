<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">精力篇：每条通知都要立刻看</title><desc id="d">手机旁的电量显示接近耗尽。</desc><rect width="1200" height="675" fill="#f6f1e6"/><circle cx="1030" cy="100" r="230" fill="#f4d77c"/><circle cx="80" cy="650" r="195" fill="#c9dfd4"/><rect x="70" y="70" width="1060" height="535" rx="28" fill="none" stroke="#253a36" stroke-width="3"/><text x="120" y="190" fill="#dd684b" font-family="Microsoft YaHei,sans-serif" font-size="28">一本反向生活指南</text><text x="120" y="280" fill="#253a36" font-family="Microsoft YaHei,sans-serif" font-size="67" font-weight="bold">精力篇</text><text x="120" y="350" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="31">每条通知都要立刻看</text><text x="120" y="535" fill="#52665e" font-family="Microsoft YaHei,sans-serif" font-size="24">精力用完之前，记得休息</text><rect x="820" y="275" width="190" height="270" rx="30" fill="#c9dfd4" stroke="#253a36" stroke-width="10"/><rect x="850" y="380" width="125" height="55" rx="8" fill="none" stroke="#253a36" stroke-width="6"/><rect x="858" y="388" width="27" height="39" fill="#dd684b"/><path d="M975 398h10v20h-10" fill="#253a36"/></svg>
